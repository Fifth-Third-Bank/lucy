[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucy-scanner"
version = "1.1.1"
description = "LUCY: agentic verified source-code vulnerability review with adversarial verification and planted-recall measurement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "tree-sitter-language-pack>=0.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
]

[project.scripts]
lucy = "lucy.runtime.trial:main"

[tool.setuptools.packages.find]
include = ["lucy*"]

[tool.setuptools.package-data]
lucy = [
    "SKILL.md",
    "agents/*.md",
    "planter/*",
    "toolbox/*",
    "bin/*",
]
