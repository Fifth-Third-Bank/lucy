# Kubernetes deployment for notify-svc (fixture estate).
# Hardened baseline: non-root, read-only root filesystem, no privilege
# escalation, all capabilities dropped, default seccomp profile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-svc
  namespace: demo-app
  labels:
    app.kubernetes.io/name: notify-svc
    app.kubernetes.io/part-of: demo-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: notify-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notify-svc
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notify-svc
          image: registry.example.invalid/demo/notify-svc:1.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: AUTH_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: notify-svc-auth
                  key: public-key-pem
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notify-svc-db
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
